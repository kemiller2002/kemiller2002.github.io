name: Check v2 site pipeline

on:
  push:
    branches:
      - feature/kmm-site-001-redesign
    paths:
      - src/**
      - tests/**
      - site-src/posts/**
      - KevinMiller.Site.slnx
      - forma.lock
      - site-src/assets/site.css
      - .github/workflows/site-v2-check.yml
  pull_request:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - site-src/posts/**
      - KevinMiller.Site.slnx
      - forma.lock
      - site-src/assets/site.css
      - .github/workflows/site-v2-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install pinned Forma presentation
        uses: kemiller2002/forma/actions/install-presentation@v0.3.0
        with:
          lock: forma.lock

      - name: Check personal-site CSS boundary
        uses: kemiller2002/forma/actions/check-site-css@v0.3.0
        with:
          files: site-src/assets/site.css

      - name: Build F# publishing system
        run: dotnet build KevinMiller.Site.slnx --configuration Release

      - name: Run publishing tests
        run: dotnet test KevinMiller.Site.slnx --configuration Release --no-build

      - name: Validate content
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- validate --root .

      - name: Verify deterministic output
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- verify-build --root .

      - name: Generate static site
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- build --root . --out dist-v2

      - name: Verify generated site
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- verify-site --root . --out dist-v2

      - name: Package generated comparison artifact
        run: tar -czf site-v2.tar.gz dist-v2

      - name: Upload generated comparison artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-v2
          path: site-v2.tar.gz
          if-no-files-found: error

  browser:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check out browser tests
        uses: actions/checkout@v4

      - name: Download generated site artifact
        uses: actions/download-artifact@v4
        with:
          name: site-v2
          path: .

      - name: Extract generated site
        run: tar -xzf site-v2.tar.gz

      - name: Set up Node.js for browser verification only
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned browser-test dependencies
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Chromium
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Start generated site
        run: |
          python3 -m http.server 4001 --bind 127.0.0.1 --directory dist-v2 > /tmp/kevin-site.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4001/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kevin-site.log
          exit 1

      - name: Verify responsive and accessible browser behavior
        working-directory: tests/browser
        env:
          SITE_BASE_URL: http://127.0.0.1:4001
        run: npx playwright test site.spec.mjs --workers=1 --reporter=line
