name: Build and Deploy Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js for governance launchers
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Forma presentation
        uses: kemiller2002/forma/actions/install-presentation@v0.3.0
        with:
          lock: forma.lock

      - name: Check personal-site CSS boundary
        uses: kemiller2002/forma/actions/check-site-css@v0.3.0
        with:
          files: site-src/assets/site.css

      - name: Verify Praxis and Ordo governance
        run: |
          ./ros registry check
          ./ros validate
          npx --yes @echelon-foundry/sde@1.2.0 verify --strict

      - name: Build F# publishing system
        run: dotnet build KevinMiller.Site.slnx --configuration Release

      - name: Run publishing tests
        run: dotnet test KevinMiller.Site.slnx --configuration Release --no-build

      - name: Validate content
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- validate --root .

      - name: Verify deterministic output
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- verify-build --root .

      - name: Generate static site
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- build --root . --out dist-v2

      - name: Verify generated site
        run: dotnet run --project src/KevinMiller.Site/KevinMiller.Site.fsproj --configuration Release --no-build -- verify-site --root . --out dist-v2

      - name: Install pinned browser-test dependencies
        working-directory: tests/browser
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Install Chromium for release verification
        working-directory: tests/browser
        run: npx playwright install --with-deps chromium

      - name: Start generated site for release verification
        run: |
          python3 -m http.server 4001 --bind 127.0.0.1 --directory dist-v2 > /tmp/kevin-site.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4001/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kevin-site.log
          exit 1

      - name: Verify responsive and accessible release artifact
        working-directory: tests/browser
        env:
          SITE_BASE_URL: http://127.0.0.1:4001
        run: npx playwright test site.spec.mjs --workers=1 --reporter=line

      - name: Package inspectable build artifact
        run: tar -czf site-release.tar.gz dist-v2

      - name: Upload inspectable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-release
          path: site-release.tar.gz
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-v2

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
