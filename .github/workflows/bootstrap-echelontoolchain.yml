name: Bootstrap Echelon Toolchain

on:
  push:
    branches:
      - feature/kmm-site-001-redesign
    paths:
      - .github/workflows/bootstrap-echelontoolchain.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: feature/kmm-site-001-redesign
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Praxis 3.5.0
        run: >
          npx --yes --package=@echelon-foundry/repository-operating-system@3.5.0
          ros init --profile greenfield --project "Kevin M. Miller Site"

      - name: Install Ordo 1.4.0
        run: npx --yes @echelon-foundry/sde@1.4.0 init

      - name: Verify generated installations
        run: |
          ./ros verify
          npx --yes @echelon-foundry/sde@1.4.0 verify --strict

      - name: Commit generated bootstrap state
        shell: bash
        run: |
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No bootstrap changes required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "KMM-SITE-002 install Praxis 3.5.0 and Ordo 1.4.0"
          git push origin HEAD:feature/kmm-site-001-redesign
